# Local PostgreSQL for development: `npm run db:up`
services:
  db:
    image: postgres:16
    container_name: himalaya-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: himalaya_london
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d himalaya_london"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
